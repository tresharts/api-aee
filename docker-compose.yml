version: '3.8'

services:

  postgres-db:
    image: postgres:15
    container_name: aee-postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: aee_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7
    container_name: aee-redis-cache
    ports:
      - "6379:6379"

volumes:
  postgres-data:
    driver: local